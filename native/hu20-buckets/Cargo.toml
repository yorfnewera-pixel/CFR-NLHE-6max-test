[package]
name = "hu20-buckets"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Equity-distribution card abstraction tables for HU20 (flop, turn, river)"
publish = false

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
